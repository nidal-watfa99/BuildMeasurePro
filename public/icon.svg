<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1324" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Holographic Cyan Glow -->
    <linearGradient id="cyanLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Filter for Digital Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Obsidian Rounded Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgObsidian)" stroke="#1e293b" stroke-width="4" />
  
  <!-- Outer Digital Accent Border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#cyanLaser)" stroke-width="2.5" opacity="0.6" />

  <!-- Orbital Geometric Rings (inspired by NW Digital Logo) -->
  <ellipse cx="256" cy="256" rx="190" ry="85" fill="none" stroke="url(#glowRing)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.4" transform="rotate(-25 256 256)" />
  <ellipse cx="256" cy="256" rx="190" ry="85" fill="none" stroke="url(#cyanLaser)" stroke-width="2" stroke-dasharray="12 8" opacity="0.5" transform="rotate(35 256 256)" />

  <!-- Digital Isometric Engineering Cube -->
  <g filter="url(#neonGlow)">
    <!-- Top Face -->
    <polygon points="256,120 376,188 256,256 136,188" fill="rgba(14, 165, 233, 0.12)" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round" />
    <!-- Left Face -->
    <polygon points="136,188 256,256 256,388 136,320" fill="rgba(14, 165, 233, 0.06)" stroke="#0ea5e9" stroke-width="5" stroke-linejoin="round" />
    <!-- Right Face -->
    <polygon points="256,256 376,188 376,320 256,388" fill="rgba(37, 99, 235, 0.18)" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round" />

    <!-- Center Laser Crosshair Reticle -->
    <circle cx="256" cy="256" r="32" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.9" />
    <circle cx="256" cy="256" r="6" fill="#00f0ff" />
    
    <!-- Laser Aim Lines -->
    <line x1="256" y1="200" x2="256" y2="236" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="256" y1="276" x2="256" y2="312" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="200" y1="256" x2="236" y2="256" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="276" y1="256" x2="312" y2="256" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Digital Measurement Ruler Scale Line at bottom -->
  <path d="M140 420 L372 420" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="140" y1="410" x2="140" y2="430" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="217" y1="414" x2="217" y2="426" stroke="#0ea5e9" stroke-width="2.5" />
  <line x1="256" y1="412" x2="256" y2="428" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
  <line x1="295" y1="414" x2="295" y2="426" stroke="#0ea5e9" stroke-width="2.5" />
  <line x1="372" y1="410" x2="372" y2="430" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
</svg>
