<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1b33">
<title>BuildMeasure Pro — القياس الهندسي الشامل</title>
<style>
:root{--bg:#05070c;--s:#0c1322;--sg:linear-gradient(165deg,#111d35,#0a101d);--s2:#16213a;--tx:#eef3fb;--mu:#8fa0bd;--y:#f5b800;--bl:#4da3ff;--ok:#2fd27f;--er:#ff5a5f;--bd:#1b2a44}
:root[data-t=l]{--bg:#eef2f8;--s:#fff;--sg:#fff;--s2:#e3eaf5;--tx:#0b1b33;--mu:#4c5f7d;--bd:#c5d1e4;--bl:#1d6fd6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "IBM Plex Sans Arabic","Noto Kufi Arabic",Tajawal,"Segoe UI",Tahoma,sans-serif;padding-bottom:84px}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.logo{width:38px;height:38px;border-radius:12px;border:1px solid var(--y);display:grid;place-items:center;color:var(--y);font-weight:800;font-size:15px;letter-spacing:-1px}
header h1{font-size:17px;margin:0;flex:1;line-height:1.3}header h1 small{display:block;font-size:12px;color:var(--mu);font-weight:400}
.pill{background:var(--s);border:1px solid var(--bd);color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:17px}
main{padding:16px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 2px;font:inherit;font-size:11.5px}
nav button.on{color:var(--y)}.ic{display:block;margin:0 auto 2px;width:24px;height:24px;background:none!important;border:0!important;border-radius:0!important}
.card{background:var(--sg);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px}
.eb{display:flex;align-items:center;gap:10px;color:var(--bl);font-size:13.5px;margin-bottom:6px}.eb::before{content:"";width:26px;height:1px;background:var(--bl)}
.hero{position:relative;overflow:hidden}.hero h2{font-size:30px;line-height:1.3;margin:4px 0 6px}.hero p{color:var(--mu);margin:0 0 4px}
.hero svg{position:absolute;inset-inline-start:-10px;top:10px;width:150px;opacity:.9;background:none;border:0;pointer-events:none}
.tile{display:flex;align-items:center;gap:12px;width:100%;background:var(--sg);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:10px;color:var(--tx);font:inherit;text-align:start}
.ico{width:48px;height:48px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);display:grid;place-items:center;color:var(--y);flex:none}
.ico .ic{margin:0}.tt{flex:1}.tt b{display:block;font-size:16px}.tt small{color:var(--mu);font-size:13px}
.ar2{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;color:var(--mu);flex:none}
label{display:block;font-size:13px;color:var(--mu);margin:9px 0 4px}
input,select,textarea{width:100%;padding:12px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{background:linear-gradient(180deg,#ffd043,#f5b800);color:#111;border:0;border-radius:14px;padding:13px 14px;font:inherit;font-weight:700;width:100%;margin-top:10px}
.btn.g{background:var(--s2);color:var(--tx)}.btn.d{background:var(--er);color:#fff}.btn:disabled{opacity:.45}
.btn.sm{width:auto;padding:6px 10px;margin:0;font-size:13px;border-radius:10px}
.res{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.res b{color:var(--y);direction:ltr;text-align:end}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--s2);color:var(--mu)}
.warn{color:var(--er);font-size:13px}.okc{color:var(--ok);font-size:13px}.note{font-size:12.5px;color:var(--mu)}
.wall{display:flex;gap:6px;align-items:end;margin-bottom:6px}.wall>div{flex:1}.wall label{margin:0 0 2px}
#rp svg{width:100%;background:var(--bg);border-radius:12px;border:1px solid var(--bd)}
canvas{width:100%;border-radius:12px;border:1px solid var(--bd);touch-action:manipulation}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border:1px solid var(--bd);padding:5px;text-align:start}
#toast{position:fixed;bottom:96px;inset-inline:20px;background:var(--y);color:#111;padding:10px;border-radius:12px;text-align:center;display:none;z-index:9}
#ov{position:fixed;inset:0;display:none;color:#fff;font-family:inherit;pointer-events:none}
#sv{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0}
#sv text{paint-order:stroke;stroke:#000;stroke-width:3px;font-size:15px;font-weight:700;direction:ltr}
#at{position:absolute;top:calc(env(safe-area-inset-top) + 12px);inset-inline:12px;background:rgba(5,7,12,.78);border:1px solid #2a3b5c;border-radius:14px;padding:9px 12px;font-size:14px;text-align:center}
#ct{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);inset-inline:0;display:flex;justify-content:center;align-items:center;gap:14px;pointer-events:auto}
#ct button{border:1px solid #2a3b5c;background:rgba(5,7,12,.82);color:#fff;border-radius:16px;padding:12px 14px;font:inherit;font-size:14px}
#ct #ad{width:74px;height:74px;border-radius:50%;background:#f5b800;color:#111;font-size:34px;font-weight:700;padding:0;border:4px solid rgba(255,255,255,.7)}
@media print{header,nav,.np,#toast{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #999;background:#fff;color:#000}.res b,.card h2{color:#000}}
</style>
</head>
<body>
<header><div class="logo">BM</div><h1>BuildMeasure Pro<small id="ap"></small></h1><button class="pill np" onclick="tt()" aria-label="الوضع">◐</button></header>
<main id="m"></main>
<nav class="np" id="nv"></nav>
<div id="toast"></div>
<div id="ov"><svg id="sv"></svg><div id="at"></div><div id="ct"><button onclick="arUn()">↩ تراجع</button><button id="ad" onclick="arAdd()">＋</button><button onclick="arFin()">✔ إنهاء</button></div></div>
<script>
const $=s=>document.querySelector(s),N=(id)=>parseFloat($('#'+id)?.value)||0,F=(n,d=2)=>(Math.round(n*10**d)/10**d).toLocaleString('en',{maximumFractionDigits:d});
let db={p:[],a:null,t:'d'};
try{db=JSON.parse(localStorage.getItem('bmp'))||db}catch(e){}
function sv(){try{localStorage.setItem('bmp',JSON.stringify(db))}catch(e){toast('تعذر الحفظ التلقائي — صدّر نسخة احتياطية')}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>e.style.display='none',2600)}
function tt(){db.t=db.t=='l'?'d':'l';sv();ap()}
function ap(){document.documentElement.dataset.t=db.t;const p=db.p.find(x=>x.id==db.a);$('#ap').textContent=p?'المشروع: '+p.name:'لا يوجد مشروع نشط'}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const SRC={ar:['قياس بكاميرا الهاتف (ARCore) — غير مُتحقَّق منه بأداة مرجعية','تقريبي — قارنه بشريط قياس قبل الاعتماد'],man:['قياس يدوي مُدخل من المستخدم','يعتمد على دقة إدخالك'],cal:['تقدير بصورة + مرجع معايرة','تقريبي — يتأثر بالمنظور وزاوية التصوير'],calc:['حساب نظري من أبعاد مدخلة','يعتمد على دقة الأبعاد والافتراضات']};
function act(){let p=db.p.find(x=>x.id==db.a);if(!p){p=mk('مشروعي الأول');toast('تم إنشاء مشروع افتراضي')}return p}
function mk(name,loc='',desc=''){const p={id:uid(),name,loc,desc,date:new Date().toISOString().slice(0,10),items:[]};db.p.unshift(p);db.a=p.id;sv();ap();return p}
function add(type,title,rows,src,extra){const p=act();p.items.unshift({id:uid(),type,title,rows,src,extra:extra||null,date:new Date().toLocaleString('ar')});sv();toast('تم الحفظ في: '+p.name)}
const R=(l,v)=>`<div class="res"><span>${l}</span><b>${v}</b></div>`;
const srcTag=k=>`<p class="note">النوع: <span class="tag">${SRC[k][0]}</span> — الثقة: ${SRC[k][1]}</p>`;
const IP={ar:'<path d="M4 8V5h3M20 8V5h-3M4 16v3h3M20 16v3h-3"/><circle cx="12" cy="12" r="3"/>',room:'<path d="M5 5h9v5h5v9H5z"/>',calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>',qty:'<path d="M3 7h18M3 13h18M8 3v4M16 7v6M12 13v6M3 19h18"/>',cal:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',proj:'<path d="M3 6h7l2 2h9v11H3z"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',home:'<path d="M4 11l8-7 8 7v9H4z"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IP[n]}</svg>`;
const TL=(v,i,t,d)=>`<button class="tile" onclick="go('${v}')"><span class="ico">${ic(i)}</span><span class="tt"><b>${t}</b><small>${d}</small></span><span class="ar2">↖</span></button>`;
const V={
home(){const last=db.p.flatMap(q=>q.items.map(i=>({...i,pn:q.name}))).slice(0,4);
return `<div class="card hero"><svg viewBox="0 0 200 130" fill="none" stroke="#4da3ff" stroke-width="1.2"><polygon points="100,8 180,38 100,68 20,38" fill="rgba(77,163,255,.08)"/><polygon points="100,36 180,66 100,96 20,66" fill="rgba(77,163,255,.14)"/><polygon points="100,64 180,94 100,124 20,94" fill="rgba(245,184,0,.18)" stroke="#f5b800"/></svg>
<div class="eb">قياس هندسي</div><h2>قِس بكاميرا<br>هاتفك</h2><p>مسافات وارتفاعات ومساحات، تُحفظ مباشرة في مشروعك.</p>
<button class="btn" onclick="go('ar')">ابدأ القياس بالكاميرا</button></div>
${TL('room','room','مسح غرفة','أطوال وزوايا، مساحات وجدران وفتحات')}${TL('cal','cal','قياس بصورة مرجعية','تقدير من صورة وبُعد معلوم')}${TL('calc','calc','الأدوات الهندسية','مساحات وأحجام وتحويل وحدات')}${TL('qty','qty','حساب الكميات','خرسانة وبلاط ودهان وحفر')}${TL('proj','proj','المشاريع والتقارير','نسخ احتياطي، CSV وDXF وPDF')}${TL('set','set','الحالة والإعدادات','ما يعمل وما هو قيد البناء')}
<div class="card"><div class="eb">آخر القياسات</div>${last.length?last.map(i=>`<div class="res"><span>${i.title}<br><small class="note">${i.pn} · ${i.date}</small></span><span class="tag">${SRC[i.src][0].split(' ')[0]}</span></div>`).join(''):'<p class="note">لا توجد قياسات محفوظة بعد.</p>'}</div>
<p class="note">الإصدار 0.2 — القياس بالكاميرا تجريبي ويحتاج اختبار دقة على جهازك.</p>`},
ar(){const r=X.res;return `<div class="card"><div class="eb">الواقع المعزز</div><h2>القياس بكاميرا الهاتف</h2><div id="as" class="note">جارٍ فحص دعم الجهاز…</div>
<label>نوع القياس</label><select id="am"><option value="dist">مسافات (نقاط متتالية)</option><option value="h">ارتفاع (نقطتان)</option><option value="area">مساحة أفقية (أرضية)</option><option value="room">مسح غرفة (نقاط زوايا الأرضية)</option></select>
<button class="btn" id="ab" disabled onclick="arGo()">ابدأ القياس بالكاميرا</button>
<p class="note">وجّه الكاميرا لسطح (أرضية أو جدار) وحرّك الهاتف ببطء حتى تظهر الدائرة الخضراء، ثم اضغط ＋ عند كل نقطة. الإضاءة الجيدة والأسطح ذات الملمس تعطي نتائج أفضل. الأسطح اللامعة أو البيضاء الملساء تضعف التتبع.</p></div>
${r?`<div class="card"><h2>نتيجة آخر قياس</h2>${r.rows.map(x=>R(x[0],x[1])).join('')}${srcTag('ar')}<button class="btn" onclick="add('ar','قياس بالكاميرا: '+X.res.mt,X.res.rows,'ar')">حفظ في المشروع</button>${r.mode=='room'?'<button class="btn g" onclick="arRoom()">إرسال إلى أداة الغرفة (جدران وزوايا)</button>':''}
<label>للتحقق: القياس الحقيقي بالشريط/الليزر (م)</label><input id="rf" type="number" step="0.001"><button class="btn g" onclick="arAcc()">احسب الخطأ وسجّله</button><div id="ae"></div></div>`:''}`},
/* ---------- الغرفة ---------- */
room(){return `<div class="card"><h2>مسح غرفة (يدوي) — يدعم الغرف غير المستطيلة</h2>
<p class="note">أدخل طول كل جدار والزاوية الداخلية عند نهايته (90° للمستطيل). الجدار الأخير يُغلق الشكل.</p>
<div id="ws"></div><div class="row"><button class="btn g" onclick="aw()">＋ جدار</button><button class="btn g" onclick="rw()">− حذف الأخير</button></div>
<div class="row"><div><label>ارتفاع الغرفة (م)</label><input id="rh" type="number" step="0.01" value="${room.h}" oninput="room.h=N('rh');rc()"></div><div><label>اسم الغرفة</label><input id="rn" value="${room.n}" oninput="room.n=this.value"></div></div>
<label>الفتحات (أبواب/نوافذ)</label><div id="os"></div><div class="row"><button class="btn g" onclick="ao('باب',0.9,2.1)">＋ باب</button><button class="btn g" onclick="ao('نافذة',1.2,1.2)">＋ نافذة</button></div>
<label><input type="checkbox" id="ded" checked onchange="rc()" style="width:auto"> خصم الفتحات من مساحة الجدران</label></div>
<div class="card"><h2>النتائج</h2><div id="rr"></div></div><div class="card"><h2>المخطط ثنائي الأبعاد</h2><div id="rp"></div></div>`},
calc(){return `<div class="card"><h2>مساحات وأحجام</h2>
<select id="sh" onchange="sc()"><option value="rect">مستطيل / مربع</option><option value="tri">مثلث (قاعدة × ارتفاع)</option><option value="cir">دائرة</option><option value="poly">مضلع (إحداثيات x,y)</option><option value="box">متوازي مستطيلات (حجم)</option><option value="cyl">أسطوانة (حجم)</option><option value="cone">مخروط (حجم)</option><option value="slope">سطح مائل: فعلي مقابل مسقط</option></select>
<div id="si"></div><div id="so"></div></div>
<div class="card"><h2>تحويل الوحدات</h2><div class="row"><input id="cv" type="number" value="1" oninput="cc()"><select id="cu" onchange="cc()"><option value="1">م</option><option value="0.01">سم</option><option value="0.001">مم</option><option value="0.3048">قدم</option><option value="0.0254">بوصة</option></select></div><div id="co"></div>
<div class="row" style="margin-top:8px"><input id="ca" type="number" value="1" oninput="cc()"><select id="cb" onchange="cc()"><option value="1">م²</option><option value="0.09290304">قدم²</option></select></div><div id="cp"></div>
<div class="row" style="margin-top:8px"><input id="cvv" type="number" value="1" oninput="cc()"><select id="cw" onchange="cc()"><option value="1">م³</option><option value="0.001">لتر</option></select></div><div id="cx"></div></div>`},
qty(){return `<div class="card"><h2>حساب الكميات</h2><select id="qt" onchange="sq()"><option value="con">خرسانة (حجم نظري)</option><option value="tile">بلاط / أرضيات</option><option value="pnt">دهان / لياسة</option><option value="exc">حفر / ردم</option></select><div id="qi"></div><div id="qo"></div></div>`},
cal(){return `<div class="card"><h2>قياس بصورة مرجعية معلومة البُعد</h2>
<p class="note">1) اختر صورة لسطح مستوٍ مصوّر بشكل مواجه (مثلاً جدار). 2) انقر على طرفي بُعد تعرف طوله. 3) أدخل طوله. 4) انقر على أي نقطتين لقياس مسافة على نفس المستوى فقط.</p>
<input type="file" id="fi" accept="image/*" onchange="li(this)"><canvas id="cv2" width="640" height="440" style="margin-top:8px;display:none" onclick="cl(event)"></canvas>
<div id="cs" class="note"></div><div class="row"><div><label>الطول المعروف (م)</label><input id="kn" type="number" step="0.001" value="1"></div><button class="btn g" style="margin-top:26px" onclick="cz()">إعادة</button></div><div id="cr"></div></div>`},
proj(){return `<div class="card"><h2>مشروع جديد</h2><input id="pn" placeholder="اسم المشروع"><input id="pl" placeholder="الموقع" style="margin-top:6px"><input id="pd" placeholder="وصف" style="margin-top:6px"><button class="btn" onclick="np()">إنشاء</button></div>
${db.p.map(p=>`<div class="card" style="${p.id==db.a?'border-color:var(--y)':''}"><h2>${p.name} ${p.id==db.a?'✔':''}</h2><p class="note">${p.loc||''} ${p.desc||''} · ${p.date} · ${p.items.length} قياس</p>
<div class="row"><button class="btn sm g" onclick="db.a='${p.id}';sv();go('proj')">تنشيط</button><button class="btn sm g" onclick="rp('${p.id}')">تقرير</button><button class="btn sm g" onclick="csv('${p.id}')">CSV</button><button class="btn sm g" onclick="cp2('${p.id}')">نسخ</button><button class="btn sm d" onclick="dp('${p.id}')">حذف</button></div>
${p.items.map(i=>`<div class="res"><span>${i.title}<br><small class="note">${i.date}</small></span><span>${i.extra&&i.extra.pts?`<button class="btn sm g" onclick="dxf('${p.id}','${i.id}')">DXF</button> `:''}<button class="btn sm d" onclick="di('${p.id}','${i.id}')">✕</button></span></div>`).join('')}</div>`).join('')||'<p class="note">لا توجد مشاريع.</p>'}
<div class="card"><h2>نسخ احتياطي</h2><button class="btn g" onclick="bk()">تنزيل نسخة احتياطية (JSON)</button><label>استعادة من ملف</label><input type="file" accept=".json" onchange="rs(this)"></div>`},
set(){return `<div class="card"><h2>حالة الميزات في هذه النسخة</h2>
${[['حاسبة هندسية وتحويل وحدات','ok'],['مسح غرفة يدوي + مخطط 2D + خصم الفتحات','ok'],['حساب الكميات','ok'],['إدارة مشاريع محلية + نسخ احتياطي','ok'],['تقرير (طباعة / حفظ PDF) + CSV + DXF للغرف','ok'],['قياس بصورة مرجعية (تقديري)','ok'],['قياس بالكاميرا الحية AR / ARCore / ARKit','no'],['مسح LiDAR وأجسام 3D وتصدير OBJ/PLY','no']].map(([t,s])=>`<div class="res"><span>${t}</span><span class="${s=='ok'?'okc':'warn'}">${s=='ok'?'يعمل':'غير متاح بعد'}</span></div>`).join('')}
<p class="note">لم تُجرَ اختبارات دقة ميدانية بعد. لا تعتمد النتائج في أعمال إنشائية حساسة دون التحقق بأداة مرجعية. البيانات محفوظة في هذا المتصفح فقط ولا تُرسل لأي جهة.</p></div>
<div class="card"><h2>الوحدة الافتراضية للعرض</h2><p class="note">النتائج بالمتر والمتر المربع والمتر المكعب. التحويل متاح في الأدوات الهندسية.</p></div>`}
};
const TABS=[['home','home','الرئيسية'],['ar','ar','قياس'],['room','room','غرفة'],['calc','calc','أدوات'],['qty','qty','كميات'],['proj','proj','مشاريع']];
function go(v){cur=v;$('#m').innerHTML=V[v]();$('#nv').innerHTML=TABS.map(t=>`<button class="${t[0]==v?'on':''}" onclick="go('${t[0]}')">${ic(t[1])}${t[2]}</button>`).join('');window.scrollTo(0,0);

if((X.mode=='area'||X.mode=='room')&&P.length>2&&P[0].s&&P[P.length-1].s)o.push(`<line x1="${P[0].s[0]}" y1="${P[0].s[1]}" x2="${P[P.length-1].s[0]}" y2="${P[P.length-1].s[1]}" stroke="#2fd27f" stroke-dasharray="6 6" stroke-width="2"/>`);
if(X.pos){const r=pr(X.pos);if(r){o.push(`<circle cx="${r[0]}" cy="${r[1]}" r="20" fill="none" stroke="#2fd27f" stroke-width="3"/><circle cx="${r[0]}" cy="${r[1]}" r="3" fill="#2fd27f"/>`);const L=P.length&&P[P.length-1].s;if(L)o.push(`<line x1="${L[0]}" y1="${L[1]}" x2="${r[0]}" y2="${r[1]}" stroke="#f5b800" stroke-width="2" stroke-dasharray="5 5"/>`)}}
$('#sv').innerHTML=o.join('');$('#at').textContent=(X.pos?'● تتبع جيد — اضغط ＋ لتثبيت نقطة':'وجّه الكاميرا نحو سطح وحرّك ببطء')+' · '+arTxt()}
const d3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
function arTxt(){const c=arCalc();return c?c.mt+': '+c.rows[0][1]:'النقاط: '+X.pts.length}
function arAdd(){if(!X.pos)return;if(X.mode=='h'&&X.pts.length>=2)X.pts=[];X.pts.push(X.pos.slice())}
function arUn(){X.pts.pop()}
function arFin(){X.s&&X.s.end()}
function arCalc(){const p=X.pts,dv=navigator.userAgent.match(/\(([^)]+)\)/);const dev=['الجهاز',dv?dv[1]:'—'];
if(X.mode=='dist'&&p.length>1){let t=0;for(let i=1;i<p.length;i++)t+=d3(p[i],p[i-1]);return{mt:'مسافة',main:t,rows:[['المسافة الكلية (م)',F(t,3)],['عدد النقاط',p.length],['الطريقة','ARCore hit-test على سطح مكتشف'],dev]}}
if(X.mode=='h'&&p.length==2){const a=Math.abs(p[0][1]-p[1][1]);return{mt:'ارتفاع',main:a,rows:[['الفرق الرأسي (م)',F(a,3)],['المسافة المباشرة (م)',F(d3(p[0],p[1]),3)],['الطريقة','ARCore hit-test'],dev]}}
if((X.mode=='area'||X.mode=='room')&&p.length>2){let a=0,pm=0;p.forEach((q,i)=>{const n=p[(i+1)%p.length];a+=q[0]*n[2]-n[0]*q[2];pm+=d3(q,n)});a=Math.abs(a/2);return{mt:X.mode=='room'?'مسح غرفة':'مساحة أفقية',main:a,rows:[['المساحة المسقطة أفقياً (م²)',F(a,3)],['المحيط (م)',F(pm,3)],['ملاحظة','تُحسب على المستوى الأفقي فقط — لا تصلح لجدار أو سطح مائل'],dev]}}return null}
function arEnd(){X.res=arCalc();if(X.res){X.res.pts=X.pts.map(q=>q.slice());X.res.mode=X.mode}X.s=null;$('#ov').style.display='none';$('#sv').innerHTML='';go('ar');if(!X.res)toast('لم تُسجَّل نقاط كافية')}
function arAcc(){const rf=N('rf');if(rf<=0||!X.res){toast('أدخل القياس الحقيقي');return}const e=Math.abs(X.res.main-rf),pc=e/rf*100;const rows=[['قياس الهاتف',F(X.res.main,3)],['القياس المرجعي',F(rf,3)],['الخطأ المطلق',F(e,3)],['الخطأ النسبي %',F(pc,2)]];$('#ae').innerHTML=rows.map(x=>R(...x)).join('');add('acc','اختبار دقة: '+X.res.mt,rows,'ar')}

function arRoom(){let p=X.res.pts.map(q=>[q[0],-q[2]]),a=0;p.forEach((q,i)=>{const n=p[(i+1)%p.length];a+=q[0]*n[1]-n[0]*q[1]});if(a<0)p.reverse();const n=p.length;
room.w=p.map((q,i)=>{const nx=p[(i+1)%n],nn=p[(i+2)%n],d1=[nx[0]-q[0],nx[1]-q[1]],d2=[nn[0]-nx[0],nn[1]-nx[1]],t=Math.atan2(d1[0]*d2[1]-d1[1]*d2[0],d1[0]*d2[0]+d1[1]*d2[1])*180/Math.PI;return{l:Math.round(Math.hypot(d1[0],d1[1])*100)/100,a:Math.round((180-t)*10)/10}});room.n='غرفة (مسح بالكاميرا)';go('room');toast('أدخل ارتفاع الغرفة وراجع الأطوال')}
function exo(){const g=room.g,h=room.h,n=g.pts.length,ix=[...Array(n).keys()];let t='# BuildMeasure Pro simplified model from entered dimensions\n';g.pts.forEach(q=>t+=`v ${q[0].toFixed(4)} 0 ${(-q[1]).toFixed(4)}\n`);g.pts.forEach(q=>t+=`v ${q[0].toFixed(4)} ${h} ${(-q[1]).toFixed(4)}\n`);t+='f '+ix.map(i=>i+1).join(' ')+'\n';t+='f '+ix.map(i=>n+i+1).reverse().join(' ')+'\n';for(let i=0;i<n;i++){const j=(i+1)%n;t+=`f ${i+1} ${j+1} ${n+j+1} ${n+i+1}\n`}dl(room.n+'.obj',t,'text/plain')}
ap();go('home');
</script>
